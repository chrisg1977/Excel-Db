server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Backward-compatible dashboard path support:
  # /dashboard/eos.html -> /eos.html
  location ~ ^/dashboard/(.*)$ {
    try_files /$1 =404;
  }

  # Prevent HTML files from being cached so updates are always picked up
  location ~* \.html$ {
    try_files $uri =404;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Pragma "no-cache";
    add_header Expires "0";
  }

  # Standard static file serving from dashboard root
  location / {
    try_files $uri $uri/ =404;
  }
}
