services:
  pg_excel:
    image: postgres:16
    container_name: pg_excel
    environment:
      POSTGRES_USER: excel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the deployment environment}
      POSTGRES_DB: exceldb
    ports:
      - "55432:5432"
    volumes:
      - pg_excel_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U excel -d exceldb"]
      interval: 5s
      timeout: 5s
      retries: 20

  directus_excel:
    build:
      context: .
      dockerfile: docker/directus/Dockerfile.prod
    image: directus-excel:prod
    container_name: directus_excel
    depends_on:
      pg_excel:
        condition: service_healthy
    ports:
      - "8055:8055"
    environment:
      DB_CLIENT: pg
      DB_HOST: pg_excel
      DB_PORT: 5432
      DB_DATABASE: exceldb
      DB_USER: app_directus
      DB_PASSWORD: ${DIRECTUS_DB_PASSWORD:?Set DIRECTUS_DB_PASSWORD in the deployment environment}
      DB_SCHEMA: public
      DB_SEARCH_PATH: public,directus
      ADMIN_EMAIL: ${DIRECTUS_ADMIN_EMAIL:?Set DIRECTUS_ADMIN_EMAIL in the deployment environment}
      ADMIN_PASSWORD: ${DIRECTUS_ADMIN_PASSWORD:?Set DIRECTUS_ADMIN_PASSWORD in the deployment environment}
      KEY: ${DIRECTUS_KEY:?Set DIRECTUS_KEY in the deployment environment}
      SECRET: ${DIRECTUS_SECRET:?Set DIRECTUS_SECRET in the deployment environment}
      EMAIL_ACCOUNTS_ENCRYPTION_KEY: ${EMAIL_ACCOUNTS_ENCRYPTION_KEY:?Set EMAIL_ACCOUNTS_ENCRYPTION_KEY in the deployment environment}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:?Set GOOGLE_OAUTH_CLIENT_ID in the deployment environment}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:?Set GOOGLE_OAUTH_CLIENT_SECRET in the deployment environment}
      GOOGLE_OAUTH_REDIRECT_URI: ${GOOGLE_OAUTH_REDIRECT_URI:?Set GOOGLE_OAUTH_REDIRECT_URI in the deployment environment}
    volumes:
      - ./directus-uploads:/directus/uploads

volumes:
  pg_excel_data:
